name: Compilar FPKGi

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Baixar Código
        uses: actions/checkout@v4

      - name: Configurar Compilador MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Compilar Apenas os Codigos .cs
        run: |
          mkdir Saida
          csc.exe /target:library /out:Saida/Assembly-CSharp.dll *.cs
        continue-on-error: true

      - name: Baixar o Arquivo Pronto
        uses: actions/upload-artifact@v4
        with:
          name: FPKGi-Modificado
          path: Saida/Assembly-CSharp.dll
