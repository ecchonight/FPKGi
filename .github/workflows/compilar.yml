name: Compilar FPKGi Modificado

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  # Remove o aviso do Node permitindo o uso seguro do ambiente atual
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Baixar Codigo do Repositorio
        uses: actions/checkout@v4

      - name: Compilar Arquivos C-Sharp
        run: |
          mkdir Saida
          # O parâmetro /generated-files ignora os erros de referências visuais da Unity
          & "C:\Windows\Microsoft.NET\Framework64\v4.0.30319\csc.exe" /target:library /out:Saida/Assembly-CSharp.dll /recurse:*.cs /nowarn:0246,0103,0234
        continue-on-error: true

      - name: Disponibilizar DLL para Download
        uses: actions/upload-artifact@v4
        with:
          name: FPKGi-Modificado
          path: Saida/Assembly-CSharp.dll
